version: '3.9'

services:
  # Ollama - Local LLM inference engine with Qwen3-4B
  ollama:
    image: ollama/ollama:latest
    container_name: sih26122-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: serve

  # Ingestion Service (FastAPI) - Member A
  ingestion:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    container_name: sih26122-ingestion
    ports:
      - "8001:8001"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - LLM_MODEL_NAME=qwen3-4b
      - LOG_LEVEL=INFO
    volumes:
      - ./shared:/app/shared
      - ./services/ingestion:/app/services/ingestion
    working_dir: /app
    command: python -m uvicorn services.ingestion.app:app --host 0.0.0.0 --port 8001 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Matching & Confidence Engine (FastAPI) - Member B
  matching:
    build:
      context: ./services/matching
      dockerfile: Dockerfile
    container_name: sih26122-matching
    ports:
      - "8002:8002"
    depends_on:
      ingestion:
        condition: service_healthy
    environment:
      - LOG_LEVEL=INFO
    volumes:
      - ./shared:/app/shared
      - ./services/matching:/app/services/matching
    working_dir: /app
    command: python -m uvicorn services.matching.app:app --host 0.0.0.0 --port 8002 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Write-back & Analytics (FastAPI) - Member D
  writeback:
    build:
      context: ./services/writeback
      dockerfile: Dockerfile
    container_name: sih26122-writeback
    ports:
      - "8003:8003"
    depends_on:
      matching:
        condition: service_healthy
    environment:
      - LOG_LEVEL=INFO
    volumes:
      - ./shared:/app/shared
      - ./services/writeback:/app/services/writeback
    working_dir: /app
    command: python -m uvicorn services.writeback.app:app --host 0.0.0.0 --port 8003 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Analytics & Dashboard (FastAPI) - Member D
  analytics:
    build:
      context: ./services/analytics
      dockerfile: Dockerfile
    container_name: sih26122-analytics
    ports:
      - "8004:8004"
    depends_on:
      writeback:
        condition: service_healthy
    environment:
      - LOG_LEVEL=INFO
    volumes:
      - ./shared:/app/shared
      - ./services/analytics:/app/services/analytics
    working_dir: /app
    command: python -m uvicorn services.analytics.app:app --host 0.0.0.0 --port 8004 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ollama_data:

networks:
  default:
    name: sih26122-network
    driver: bridge
