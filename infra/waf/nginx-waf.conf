# ==============================================================================
# Samanvay (SIH26122) Enterprise Web Application Firewall (WAF) & Reverse Proxy
# Edge Security Gateway with OWASP Top 10 Mitigation, Rate Limiting & SSL Termination
# ==============================================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=waf_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=waf_login_limit:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=waf_conn_limit:10m;

# Block common vulnerability scanners, spiders, and attack tools
map $http_user_agent $bad_bot {
    default 0;
    ~*(?i)(sqlmap|nikto|nmap|masscan|wpscan|dirbuster|gobuster|havij|acunetix|nessus|metasploit|zgrab|morfeus) 1;
    ~*(?i)(python-requests|aiohttp|scrapy|curl)(?!.*samanvay-internal) 0; # allow internal test curl
}

# Block SQL injection / XSS / Directory traversal in query strings
map $query_string $bad_query {
    default 0;
    ~*(?i)(union\s+select|select.*from|insert\s+into|delete\s+from|drop\s+table) 1;
    ~*(?i)(<script|javascript:|data:text\/html|onerror=|onload=) 1;
    ~*(?i)(\.\.\/|\.\.\\|%2e%2e|%252e%252e) 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Redirect all plain HTTP traffic to HTTPS in production
    # return 301 https://$host$request_uri;

    # Client body and buffer limits to prevent Buffer Overflow & Memory Exhaustion DDoS
    client_max_body_size 35M;
    client_body_buffer_size 128k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;

    # Timeouts to mitigate Slowloris attacks
    client_body_timeout 15s;
    client_header_timeout 12s;
    keepalive_timeout 65s;
    send_timeout 15s;

    # Global Rate Limiting & Connection Concurrency Control
    limit_conn waf_conn_limit 20;
    limit_req zone=waf_api_limit burst=25 nodelay;

    # Enterprise HTTP Security Response Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-WAF-Gateway "Samanvay-Enterprise-Edge-WAF" always;

    # 1. Block Bad Bots & Automated Scanners
    if ($bad_bot = 1) {
        return 403 '{"error": "Forbidden", "detail": "Automated security scanner or malicious user-agent detected.", "code": "WAF_BOT_BLOCKED"}';
    }

    # 2. Block SQLi / XSS in Query Strings
    if ($bad_query = 1) {
        return 403 '{"error": "Security Violation", "detail": "Malicious SQLi/XSS/Traversal pattern detected in request query.", "code": "WAF_QUERY_BLOCKED"}';
    }

    # 3. Block Hidden & System Files (.git, .env, .htaccess)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # --------------------------------------------------------------------------
    # Frontend Routing (React Single Page Applications)
    # --------------------------------------------------------------------------
    
    # Review Console (Planning Engineers Dashboard)
    location / {
        proxy_pass http://review-console:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Time Agent (Field Supervisor Mobile PWA)
    location /agent/ {
        proxy_pass http://time-agent:5174/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Zero-Trust Microservice Routing with Internal Secret Gateway Injection
    # --------------------------------------------------------------------------

    # Ingestion & Multi-Format Parsing Microservice (:8001)
    location /api/v1/ingest/ {
        proxy_pass http://ingestion:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        # Zero Trust Secret Token injected only by trusted WAF gateway
        proxy_set_header X-Internal-Gateway-Token "samanvay-internal-vpc-secret-2026";
    }

    # Matching & FAISS Confidence Engine Microservice (:8002)
    location /api/v1/matching/ {
        proxy_pass http://matching:8002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Internal-Gateway-Token "samanvay-internal-vpc-secret-2026";
    }

    # Writeback & OLTP Audit Logger Microservice (:8003)
    location /api/v1/writeback/ {
        proxy_pass http://writeback:8003/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Internal-Gateway-Token "samanvay-internal-vpc-secret-2026";
    }

    # DuckDB Analytics & S-Curve Microservice (:8004)
    location /api/v1/analytics/ {
        proxy_pass http://analytics:8004/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Internal-Gateway-Token "samanvay-internal-vpc-secret-2026";
    }

    # Node.js Sync Bridge (:3000)
    location /bridge/ {
        proxy_pass http://bridge:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
